<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theme Preference</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#ffffff;
}

.container{
    text-align:center;
}

h1{
    font-size:55px;
    color:#222;
    margin-bottom:50px;
    font-weight:bold;
}

button{
    padding:15px 35px;
    font-size:22px;
    border:none;
    border-radius:8px;
    background:#6d6d6d;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#555;
}
</style>

</head>
<body>

    <div class="container">
        <h1>Theme Preference</h1>
        <button id="toggleBtn">Toggle Theme</button>
    </div>

    <script src="DarkLightMode.js"></script>

</body>
</html>

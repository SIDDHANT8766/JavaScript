<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Profile Cards</title>
</head>
<body class="bg-[#0f172a] min-h-screen flex justify-center items-center">

    <div class="flex gap-5">

        <!-- Card 1 -->
        <div class="bg-[#1e293b] rounded-lg shadow-lg px-5 py-4 w-72 hover:scale-105 duration-300">

            <div class="flex items-center gap-4">

                <!-- Profile Image -->
                <img
                    src="https://randomuser.me/api/portraits/men/32.jpg"
                    alt="Profile"
                    class="w-14 h-14 rounded-full border-2 border-gray-500 object-cover">

                <!-- Details -->
                <div>
                    <h2 class="text-white text-xl font-bold">
                        John Doe
                    </h2>

                    <p class="text-gray-400 text-sm">
                        john.doe@example.com
                    </p>

                    <span class="inline-block mt-2 bg-blue-700 text-white text-xs px-3 py-1 rounded-full">
                        Active
                    </span>
                </div>

            </div>

        </div>

        <!-- Card 2 -->
        <div class="bg-[#1e293b] rounded-lg shadow-lg px-5 py-4 w-72 hover:scale-105 duration-300">

            <div class="flex items-center gap-4">

                <!-- Profile Image -->
                <img
                    src="https://randomuser.me/api/portraits/men/32.jpg"
                    alt="Profile"
                    class="w-14 h-14 rounded-full border-2 border-gray-500 object-cover">

                <!-- Details -->
                <div>
                    <h2 class="text-white text-xl font-bold">
                        John Doe
                    </h2>

                    <p class="text-gray-400 text-sm">
                        john.doe@example.com
                    </p>

                    <span class="inline-block mt-2 bg-blue-700 text-white text-xs px-3 py-1 rounded-full">
                        Active
                    </span>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
